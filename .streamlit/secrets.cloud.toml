# .streamlit/secrets.toml (or your designated testing file)

# 1. Update the deployment mode
APP_DEPLOYMENT_MODE = "cloud"

# 2. Update the remote database endpoint
DATABASE_URL = "postgresql+psycopg://<AIVEN_USER>:<AIVEN_PASSWORD>@<AIVEN_HOST>:<AIVEN_PORT>/<DATABASE_NAME>"

# 3. Update your OIDC callback under the [auth] block
[auth]
redirect_uri = "https://<your-app-name>.streamlit.app/oauth2callback"
cookie_secret = "<YOUR_RANDOM_SECRET>"
client_id = "<YOUR_GOOGLE_CLIENT_ID>"
client_secret = "<YOUR_GOOGLE_CLIENT_SECRET>"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

# Cloud Pilot Budgets and Limits (Keep these as configured)
DB_SSLMODE = "require"
DB_POOL_SIZE = 4
DB_MAX_OVERFLOW = 1
DB_POOL_TIMEOUT_SECONDS = 5
DB_POOL_RECYCLE_SECONDS = 300
DB_CONNECT_TIMEOUT_SECONDS = 5
CLOUD_DATABASE_CONNECTION_LIMIT = 20
CLOUD_DATABASE_STORAGE_LIMIT_MB = 1024