# Copy these keys into Streamlit Community Cloud's protected secrets editor.
# Never commit the populated values or paste them into tickets or chat.

APP_DEPLOYMENT_MODE = "cloud"
DATABASE_URL = "postgresql://REPLACE_USER:REPLACE_PASSWORD@REPLACE_AIVEN_HOST:REPLACE_PORT/REPLACE_DATABASE"
DB_SSLMODE = "require"
DB_POOL_SIZE = "4"
DB_MAX_OVERFLOW = "1"
DB_POOL_TIMEOUT_SECONDS = "5"
DB_POOL_RECYCLE_SECONDS = "300"
CLOUD_DATABASE_CONNECTION_LIMIT = "20"
CLOUD_DATABASE_STORAGE_LIMIT_MB = "1024"

[auth]
redirect_uri = "https://REPLACE_STREAMLIT_SUBDOMAIN.streamlit.app/oauth2callback"
cookie_secret = "REPLACE_WITH_RANDOM_COOKIE_SECRET"
client_id = "REPLACE_WITH_GOOGLE_CLIENT_ID"
client_secret = "REPLACE_WITH_GOOGLE_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
